[project]
name = "youtube-download-api"
version = "0.1.0"
description = "FastAPI-based server for downloading YouTube videos using yt-dlp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "yt-dlp>=2024.3.10",
    "python-multipart>=0.0.9",
    "loguru>=0.7.0",
    "httpx>=0.26.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",

]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
